on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm make libbpf-dev
        
      - name: Generate eBPF
        run: go generate ./...
        
      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.tag_name }}" -o bpflite-linux-amd64 ./cmd/bpflite
        
      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.tag_name }}" -o bpflite-linux-arm64 ./cmd/bpflite
        
      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} bpflite-linux-amd64 bpflite-linux-arm64
