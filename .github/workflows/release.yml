name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install LLVM/Clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm make

    - name: Generate eBPF
      run: go generate ./...

    - name: Build Linux AMD64
      run: GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bpflite-linux-amd64 ./cmd/bpflite

    - name: Build Linux ARM64
      run: GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bpflite-linux-arm64 ./cmd/bpflite

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bpflite-linux-amd64
          bpflite-linux-arm64
        generate_release_notes: true
